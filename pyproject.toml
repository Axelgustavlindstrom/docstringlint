[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docstringlint"
version = "0.1.0"
description = "Audit Python files for missing or empty docstrings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ProjectCreationAgent" }]
keywords = ["docstring", "lint", "cli", "python", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
docstringlint = "docstringlint:main"

[tool.setuptools]
py-modules = ["docstringlint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
